name: Source build checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - name: Check integration syntax
        run: |
          node --check packages/zhixu/lib/feishu.js
          node --check packages/zhixu/engine/business.cjs
      - name: Build source and check TypeScript
        run: pnpm run build:all
